<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520">
  <rect width="900" height="520" fill="white"/>
  <text x="450" y="52" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#111">Reported Model Accuracy</text>
  <text x="450" y="82" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#555">Offline handwriting writer identification</text>

  <line x1="130" y1="410" x2="810" y2="410" stroke="#222" stroke-width="2"/>
  <line x1="130" y1="120" x2="130" y2="410" stroke="#222" stroke-width="2"/>

  <g font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#555">
    <text x="115" y="414" text-anchor="end">0%</text>
    <text x="115" y="356" text-anchor="end">20%</text>
    <text x="115" y="298" text-anchor="end">40%</text>
    <text x="115" y="240" text-anchor="end">60%</text>
    <text x="115" y="182" text-anchor="end">80%</text>
    <text x="115" y="124" text-anchor="end">100%</text>
  </g>

  <g stroke="#ddd" stroke-width="1">
    <line x1="130" y1="352" x2="810" y2="352"/>
    <line x1="130" y1="294" x2="810" y2="294"/>
    <line x1="130" y1="236" x2="810" y2="236"/>
    <line x1="130" y1="178" x2="810" y2="178"/>
    <line x1="130" y1="120" x2="810" y2="120"/>
  </g>

  <rect x="245" y="247.9" width="160" height="162.1" rx="8" fill="#6b7280"/>
  <rect x="535" y="216.0" width="160" height="194.0" rx="8" fill="#111827"/>

  <g font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="22" fill="#111">
    <text x="325" y="232" text-anchor="middle">55.9%</text>
    <text x="615" y="200" text-anchor="middle">66.9%</text>
  </g>

  <g font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#222">
    <text x="325" y="446" text-anchor="middle">Custom CNN</text>
    <text x="615" y="446" text-anchor="middle">InceptionV3</text>
  </g>

  <text x="450" y="486" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#555">InceptionV3 achieved ~11 percentage points higher reported accuracy.</text>
</svg>
